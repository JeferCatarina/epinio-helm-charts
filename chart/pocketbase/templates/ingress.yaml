apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pocketbase.fullname" . }}
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }} 
    {{- end }}
  labels:
    {{- range $key, $value := .Values.labels }}
    {{ $key }}: {{ $value | quote }} 
    {{- end }}
    {{- include "pocketbase.labels" . | nindent 4 }}
spec:
  ingressClassName: nginx
  rules:
  - host: {{ printf "%s.%s.%s" (include "pocketbase.fullname" .) .Release.Namespace  .Values.domain }}
    http:
      paths:
      - backend:
          service:
            name: {{ include "pocketbase.fullname" . }}
            port:
              number: 8080
        path: /
        pathType: ImplementationSpecific
  tls:
    - hosts:
      - {{ printf "%s.%s.%s" (include "pocketbase.fullname" .) .Release.Namespace  .Values.domain }}
      secretName: "{{ include "pocketbase.fullname" . }}-tls"
